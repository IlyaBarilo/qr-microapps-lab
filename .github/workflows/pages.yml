name: Publish release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release and Pages
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Test before publishing
        run: npm --prefix tests run check
      - name: Inject release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if grep -q "__APP_VERSION__" qr-microapps-lab.html; then
            node tools/set-standalone-version.mjs --version "$RELEASE_TAG"
          fi
      - name: Attach standalone HTML to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$RELEASE_TAG" qr-microapps-lab.html --clobber
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Prepare static artifact
        run: |
          mkdir _site
          cp pages/index.html _site/index.html
          cp pages/.nojekyll _site/.nojekyll
          cp qr-microapps-lab.html _site/qr-microapps-lab.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
